backend:
  name: git-gateway
  branch: main

media_folder: "public/uploads"
public_folder: "/uploads"

locale: "ar"
i18n:
  structure: multiple_files
  locales: [ar, en]
  default_locale: ar

collections:
  - name: "projects"
    label: "Graphic Design Projects"
    label_singular: "Project"
    folder: "src/content/projects"
    create: true
    slug: "{{slug}}"
    i18n: true
    fields:
      - { label: "Title", name: "title", widget: "string", i18n: true }
      - { label: "Description", name: "description", widget: "text", i18n: true }
      - { label: "Image", name: "image", widget: "image", i18n: duplicate }
      - { label: "Link", name: "link", widget: "string", required: false, i18n: duplicate }
      - { label: "Category", name: "category", widget: "string", i18n: true }
      - { label: "Featured", name: "featured", widget: "boolean", default: false, i18n: duplicate }
      - { label: "Order", name: "order", widget: "number", default: 0, i18n: duplicate }

  - name: "motion"
    label: "Motion Graphics"
    label_singular: "Motion Project"
    folder: "src/content/motion"
    create: true
    slug: "{{slug}}"
    i18n: true
    fields:
      - { label: "Title", name: "title", widget: "string", i18n: true }
      - { label: "Description", name: "description", widget: "text", i18n: true }
      - { label: "Video URL", name: "videoUrl", widget: "string", i18n: duplicate }
      - { label: "Poster Image", name: "posterImage", widget: "image", i18n: duplicate }
      - { label: "Featured", name: "featured", widget: "boolean", default: false, i18n: duplicate }
      - { label: "Order", name: "order", widget: "number", default: 0, i18n: duplicate }

  - name: "about"
    label: "About Page"
    files:
      - label: "About Content"
        name: "about"
        file: "src/content/about.json"
        i18n: true
        fields:
          - { label: "Page Title", name: "title", widget: "string", i18n: true }
          - { label: "Who We Are", name: "whoWeAre", widget: "markdown", i18n: true }
          - label: "Services"
            name: "services"
            widget: "list"
            i18n: true
            fields:
              - { label: "Service Name", name: "name", widget: "string", i18n: true }
              - { label: "Description", name: "description", widget: "text", i18n: true }
          - label: "Why Choose Us"
            name: "whyChooseUs"
            widget: "list"
            i18n: true
            fields:
              - { label: "Reason", name: "reason", widget: "string", i18n: true }

  - name: "settings"
    label: "Settings"
    files:
      - label: "Site Settings"
        name: "site"
        file: "src/content/settings.json"
        fields:
          - { label: "Site Title (AR)", name: "titleAr", widget: "string" }
          - { label: "Site Title (EN)", name: "titleEn", widget: "string" }
          - { label: "Description (AR)", name: "descriptionAr", widget: "text" }
          - { label: "Description (EN)", name: "descriptionEn", widget: "text" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Location (AR)", name: "locationAr", widget: "string" }
          - { label: "Location (EN)", name: "locationEn", widget: "string" }
          - label: "Social Media"
            name: "social"
            widget: "object"
            fields:
              - { label: "Facebook", name: "facebook", widget: "string", required: false }
              - { label: "Twitter", name: "twitter", widget: "string", required: false }
              - { label: "Instagram", name: "instagram", widget: "string", required: false }
              - { label: "LinkedIn", name: "linkedin", widget: "string", required: false }
